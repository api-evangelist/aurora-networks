aid: aurora-networks
name: Aurora Networks
description: >-
  Aurora Networks is the broadband and access networks brand of Vistance Networks, Inc.
  (Nasdaq: VISN), the company CommScope renamed itself to in January 2026 after divesting
  its Connectivity and Cable Solutions segment to Amphenol. Aurora Networks builds
  end-to-end access network infrastructure for global cable and broadband service
  providers: HFC and PON access systems, cable headend optics platforms, CMTS and CCAP
  gear, Distributed Access Architecture (DAA) devices, optical hubs, nodes and passives,
  RF and RFoG equipment, and video processing, security and delivery systems. Its
  ServAssure NXT family adds network performance management, alarm handling and service
  assurance software on top of that hardware estate. The brand originates with Aurora
  Networks, Inc., founded in Santa Clara, California in 1999 as a pure-play optical
  transport supplier to cable operators, backed by Battery Ventures among ten investors
  across roughly $60M raised, and acquired by Pace plc for $323M in 2013 before passing
  through ARRIS and CommScope. Aurora Networks is a network equipment vendor rather than
  an API provider; it publishes no public developer portal, no public API reference, and
  no machine-readable API specification. Product and integration documentation, including
  the ServAssure NXT web service and message-bus integration surfaces, sits behind
  authenticated customer support portals.
